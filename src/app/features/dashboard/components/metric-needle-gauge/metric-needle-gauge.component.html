<article class="gauge-card" [class.warm]="tone === 'warm'" [class.good]="tone === 'good'"
  [class.warn]="tone === 'warn'">
  <header class="gauge-head">
    <span class="gauge-icon">{{ icon }}</span>
    <div class="gauge-copy">
      <span class="gauge-label">{{ label }}</span>
      <small>{{ status }}</small>
    </div>
  </header>

  <div class="dial-area">
    <svg class="dial" viewBox="0 0 320 190" role="img" [attr.aria-label]="label + ' ' + formattedValue + ' ' + unit">
      <defs>
        <linearGradient [attr.id]="gradientId" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="var(--gauge-start)" />
          <stop offset="55%" stop-color="var(--gauge-mid)" />
          <stop offset="100%" stop-color="var(--gauge-end)" />
        </linearGradient>
        <filter [attr.id]="glowId" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="1.5" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <path class="arc-base" d="M48 145 A112 112 0 0 1 272 145" pathLength="100" />
      <path class="arc-value" d="M48 145 A112 112 0 0 1 272 145" pathLength="100"
        [attr.stroke-dasharray]="progress + ' 100'" [attr.stroke]="'url(#' + gradientId + ')'" />

      @for (tick of ticks; track $index) {
      <line class="tick" [attr.x1]="tick.x1" [attr.y1]="tick.y1" [attr.x2]="tick.x2" [attr.y2]="tick.y2" />
      }

      <line class="needle-shadow" x1="160" y1="145" [attr.x2]="needleX" [attr.y2]="needleY" />
      <line class="needle" x1="160" y1="145" [attr.x2]="needleX" [attr.y2]="needleY"
        [attr.filter]="'url(#' + glowId + ')'" />
      <circle class="needle-point" [attr.cx]="needleX" [attr.cy]="needleY" r="4.2" />
      <circle class="hub-ring" cx="160" cy="145" r="11" />
      <circle class="hub" cx="160" cy="145" r="4.5" />
      <text class="min-label" x="48" y="174">{{ minLabel }}</text>
      <text class="max-label" x="272" y="174">{{ maxLabel }}</text>
    </svg>
  </div>

  <div class="reading">
    <strong>{{ formattedValue }}</strong>
    <span>{{ unit }}</span>
  </div>
</article>
